spring:
  application:
    name: fri-app

  datasource:
    url: jdbc:postgresql://localhost:5432/friapp_dev
    username: friapp
    password: friapp_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.friapp: INFO
    org.flywaydb: INFO

app:
  jwt:
    secret: ZnJpYXBwLWp3dC1zZWNyZXQtZGV2LTIwMjYtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLWNoYW5nZS1tZQ==
    expiration-days: 7
